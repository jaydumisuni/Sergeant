name: Model-Free Product Visual Proof

on:
  pull_request:
    paths:
      - README.md
      - SUBMISSION_READY.md
      - AGENTS.md
      - CLAUDE.md
      - package.json
      - docs/22-semantic-open-model-review.md
      - docs/25-cloudflare-workers-ai.md
      - docs/34-cpl-officer-amplification.md
      - docs/35-cpl-council-command-and-experience.md
      - docs/38-cpl-noise-governor-and-route-failover.md
      - docs/39-review-intelligence-proof.md
      - docs/55-model-free-core-and-optional-model-reasoning.md
      - docs/hackathon-submission.md
      - docs/submission-proof.md
      - docs/releases/v0.4.1.md
      - resources/sergeant-command-center-v2.*
      - resources/readme-top-image.png
      - src/vscode/**
      - adapters/jetbrains/**
      - tests/model-free-product-visual.spec.js
      - .github/workflows/model-free-product-visual-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install render tools
        run: |
          python -m pip install --upgrade markdown
          npm install --no-save @playwright/test@1.52.0
          npx playwright install --with-deps chromium
      - name: Build documentation and Command Center previews
        run: |
          mkdir -p build/resources artifacts/model-free-product
          cp resources/readme-top-image.png build/resources/readme-top-image.png
          python - <<'PY'
          from pathlib import Path
          import html
          import markdown

          def render_markdown(path: str) -> str:
              source = Path(path).read_text(encoding='utf-8')
              return markdown.markdown(source, extensions=['tables', 'fenced_code'])

          sections = [
              ('README', render_markdown('README.md')),
              ('Canonical product boundary', render_markdown('docs/55-model-free-core-and-optional-model-reasoning.md')),
              ('Submission readiness wording', render_markdown('SUBMISSION_READY.md')),
              ('Submission proof wording', render_markdown('docs/submission-proof.md')),
              ('Hackathon wording', render_markdown('docs/hackathon-submission.md')),
              ('0.4.1 release wording', render_markdown('docs/releases/v0.4.1.md')),
          ]
          body = ''.join(f'<section><h1>{html.escape(title)}</h1>{content}</section>' for title, content in sections)
          page = f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sergeant model-free product documentation</title><style>
          :root{{--bg:#070912;--panel:#111827;--text:#f8fafc;--muted:#cbd5e1;--line:#334155;--accent:#a855f7}}
          *{{box-sizing:border-box}}html,body{{margin:0;max-width:100%;overflow-x:hidden}}body{{background:var(--bg);color:var(--text);font:16px/1.65 Inter,Segoe UI,Arial,sans-serif;padding:32px}}section{{max-width:1040px;margin:0 auto 28px;padding:28px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}}h1,h2,h3{{line-height:1.2;overflow-wrap:anywhere}}p,li,td,th,code{{overflow-wrap:anywhere}}img{{display:block;max-width:100%;height:auto;margin-inline:auto}}a{{color:#7dd3fc}}pre{{overflow:auto;max-width:100%;padding:16px;border:1px solid var(--line);border-radius:10px;background:#020617}}code{{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}}table{{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}}th,td{{padding:8px 10px;border:1px solid var(--line);text-align:left}}blockquote{{margin-left:0;padding:8px 16px;border-left:4px solid var(--accent);color:var(--muted)}}@media(max-width:600px){{body{{padding:10px;font-size:15px}}section{{padding:16px;border-radius:12px}}}}
          </style></head><body>{body}</body></html>'''
          Path('build/model-free-docs-preview.html').write_text(page, encoding='utf-8')

          resources = Path('resources')
          command = (resources / 'sergeant-command-center-v2.html').read_text(encoding='utf-8')
          command = command.replace('/* SERGEANT_CSS */', (resources / 'sergeant-command-center-v2.css').read_text(encoding='utf-8'))
          command = command.replace('/* SERGEANT_RESPONSIVE_CSS */', (resources / 'sergeant-command-center-v2-responsive.css').read_text(encoding='utf-8'))
          command = command.replace('// SERGEANT_JS', (resources / 'sergeant-command-center-v2.js').read_text(encoding='utf-8'))
          command = command.replace('<!-- SERGEANT_HOST_BOOTSTRAP -->', '<script>window.sergeantHostSend=(payload)=>{window.__sergeantLastPayload=payload;return true};</script>')
          Path('build/model-free-command-center-preview.html').write_text(command, encoding='utf-8')
          PY
      - name: Render and inspect desktop and mobile views
        env:
          MODEL_FREE_DOCS_PREVIEW: ${{ github.workspace }}/build/model-free-docs-preview.html
          COMMAND_CENTER_PREVIEW: ${{ github.workspace }}/build/model-free-command-center-preview.html
          VISUAL_ARTIFACTS: ${{ github.workspace }}/artifacts/model-free-product
        run: npx playwright test tests/model-free-product-visual.spec.js --reporter=line
      - name: Record visual evidence digests
        if: always()
        run: |
          if compgen -G 'artifacts/model-free-product/*.png' > /dev/null; then
            sha256sum artifacts/model-free-product/*.png | sort > artifacts/model-free-product/sha256.txt
          fi
          printf 'commit=%s\n' "$GITHUB_SHA" > artifacts/model-free-product/source.txt
          printf 'viewports=1600x1200,390x844\n' >> artifacts/model-free-product/source.txt
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-free-product-visual-evidence
          path: |
            artifacts/model-free-product/**
            test-results/**
          if-no-files-found: error

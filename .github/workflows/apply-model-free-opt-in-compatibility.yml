name: Apply Model-Free Opt-In Compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_model_free_opt_in_compatibility.py
      - .github/workflows/apply-model-free-opt-in-compatibility.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-free-default-and-docs
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply compatibility corrections
        run: python scripts/apply_model_free_opt_in_compatibility.py

      - name: Commit compatibility corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main_review/llm_provider.py tests/test_llm_cli.py tests/test_vscode_extension_package.py tests/command-center-visual.spec.js
          git commit -m "Preserve explicit optional-model opt-in"
          git push origin HEAD:fix/model-free-default-and-docs

name: One-shot finish model opt-in correction

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/one_shot_finish_model_opt_in.py
      - .github/workflows/one-shot-finish-model-opt-in.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'docs/model-free-core-optional-reasoning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/model-free-core-optional-reasoning
          fetch-depth: 0
      - name: Apply bounded correction
        run: python scripts/one_shot_finish_model_opt_in.py
      - name: Run focused checks before commit
        continue-on-error: true
        run: |
          python -m py_compile tests/test_model_free_product_identity.py tests/test_llm_provider.py tests/test_vscode_extension_package.py
          python -m pytest -q tests/test_model_free_product_identity.py tests/test_agent_working_memory.py tests/test_llm_provider.py tests/test_vscode_extension_package.py
      - name: Commit correction for exact-head proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make model reasoning explicit opt-in support"
          git push origin HEAD:docs/model-free-core-optional-reasoning

name: Model-Free Core Transfer 7

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/model-free-core-transfer-7.yml"
      - ".github/transfer-evidence/model-free-core-transfer-7-c-archive.json"
      - "scripts/run_static_training_set.py"
      - "main_review/**"

permissions:
  contents: read

jobs:
  frozen-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERGEANT_LLM_ENABLED: "false"
      SERGEANT_CPL_ENABLED: "false"
      SERGEANT_CPL_POLICY: "disabled"

    steps:
      - name: Checkout frozen Sergeant reviewer
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout Go terminal-status fixing lineage
        uses: actions/checkout@v4
        with:
          repository: acoseac/1-bit-bridge
          ref: 5590f26983bc1d5cdfcc6bb42c2a9d6c4fb47232
          path: transfer-7/bridge
          persist-credentials: false
          fetch-depth: 5

      - name: Checkout React MFA fixing lineage
        uses: actions/checkout@v4
        with:
          repository: SpiritSLO-UK/HomeAssistant-expenses-analytics
          ref: d7fc3835d5d825704e026f9ae4df8b4a1379f185
          path: transfer-7/mfa
          persist-credentials: false
          fetch-depth: 2

      - name: Freeze exact defective revisions
        shell: bash
        run: |
          set -euo pipefail
          git -C transfer-7/bridge checkout --detach 896128113a76684c1fe75c41b86d5eb1f25bdc87
          git -C transfer-7/mfa checkout --detach cd5f5e1ec69d878ff1e878b9c37a2617e4790bc8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure isolated provider state
        shell: bash
        run: echo "SERGEANT_CLOUDFLARE_USAGE_STATE=${RUNNER_TEMP}/sergeant-transfer-7-usage.json" >> "$GITHUB_ENV"

      - name: Install frozen Sergeant package
        run: python -m pip install .

      - name: Build opaque runtime manifest
        shell: bash
        run: |
          mkdir -p build/model-free-core-transfer-7
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          cases = [
              {
                  "case_id": "transfer-7-a",
                  "repository": "acoseac/1-bit-bridge",
                  "source_pr": 515,
                  "source_lineage": "PR #515 exact-base repair lineage for the recorded terminal-status defect",
                  "fixing_ref": "5590f26983bc1d5cdfcc6bb42c2a9d6c4fb47232",
                  "checkout_path": "transfer-7/bridge",
                  "changed_files": ["internal/manifest/store.go"],
              },
              {
                  "case_id": "transfer-7-b",
                  "repository": "SpiritSLO-UK/HomeAssistant-expenses-analytics",
                  "source_pr": 511,
                  "source_lineage": "PR #511 exact-base repair lineage for the recorded MFA session-ordering defect",
                  "fixing_ref": "d7fc3835d5d825704e026f9ae4df8b4a1379f185",
                  "checkout_path": "transfer-7/mfa",
                  "changed_files": ["frontend/src/pages/Settings.tsx"],
              },
          ]
          for case in cases:
              case["defective_ref"] = subprocess.check_output(
                  ["git", "-C", case["checkout_path"], "rev-parse", "HEAD"],
                  text=True,
              ).strip()
              case["workspace_policy"] = "static_first"

          manifest = {
              "schema_version": "sergeant.review-training.v1",
              "set_id": "model-free-core-transfer-7",
              "purpose": "Seventh untouched transfer validation across live terminal-state monotonicity and MFA session-ordering cases. The historical authenticated-owner case is preserved separately as a non-rerunnable archived control because its external repository disappeared.",
              "rules": {
                  "models_enabled": False,
                  "workspace_default": "none",
                  "expected_defects_visible_to_sergeant": False,
                  "runtime_is_confirmation_not_discovery": True,
                  "classification": "untouched_transfer_validation",
                  "provenance_required": True,
                  "provenance_contract": "sergeant.training-provenance.v1",
                  "reviewer_code_frozen_before_target_selection": "c06f9cd394488188ed1e458bbfcdbc0331ff0ec1"
              },
              "cases": cases,
              "archived_controls": [
                  {
                      "case_id": "transfer-7-c",
                      "status": "archived_non_rerunnable_external_source",
                      "evidence_path": ".github/transfer-evidence/model-free-core-transfer-7-c-archive.json",
                      "original_run_id": 29691505027,
                      "artifact_id": 8443714087,
                      "artifact_digest": "sha256:00407f5b9ed46283d3d79c876f4e972d352dde5475846f03bc4eb090a38b82a7",
                  }
              ],
          }
          Path("build/model-free-core-transfer-7/runtime-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run normal pr-review on untouched revisions
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_static_training_set.py \
            build/model-free-core-transfer-7/runtime-manifest.json \
            --output build/model-free-core-transfer-7/frozen-result.json \
            2>&1 | tee build/model-free-core-transfer-7/frozen-summary.json

      - name: Publish frozen transfer summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Model-free Sergeant core — transfer 7"
            echo
            echo "Exact Sergeant head: \`${GITHUB_SHA}\`"
            echo
            echo "Archived historical control: \`transfer-7-c\` → \`.github/transfer-evidence/model-free-core-transfer-7-c-archive.json\`"
            echo
            echo '```json'
            cat build/model-free-core-transfer-7/frozen-summary.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable transfer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-free-core-transfer-7
          path: build/model-free-core-transfer-7/
          if-no-files-found: error
          retention-days: 90

name: One-shot repair explicit model opt-in semantics

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/one_shot_repair_opt_in_semantics.py
      - .github/workflows/one-shot-repair-opt-in-semantics.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'docs/model-free-core-optional-reasoning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/model-free-core-optional-reasoning
          fetch-depth: 0
      - name: Apply bounded semantic repair
        run: python scripts/one_shot_repair_opt_in_semantics.py
      - name: Run focused regression checks
        continue-on-error: true
        run: |
          python -m py_compile main_review/llm_provider.py tests/test_llm_provider.py tests/test_llm_cli.py tests/test_jetbrains_command_center.py tests/test_model_free_product_identity.py
          python -m pytest -q tests/test_llm_provider.py tests/test_cloudflare_provider.py tests/test_llm_cli.py tests/test_jetbrains_command_center.py tests/test_model_free_product_identity.py
      - name: Commit repair for exact-head proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair explicit model opt-in semantics"
          git push origin HEAD:docs/model-free-core-optional-reasoning

name: SAE-R2 Rust Proof

on:
  pull_request:
    paths:
      - 'rust/sergeant-assurance-kernel/**'
      - 'rust/sergeant-assurance-identity/**'
      - 'main_review/rust_assurance_kernel.py'
      - 'tests/test_sae_r2_kernel.py'
      - 'docs/118-sae-r2-rust-assurance-kernel-candidate.md'
      - 'docs/119-sae-r2-rust-assurance-kernel-candidate-manifest.json'
      - '.github/workflows/sae-r2-rust-proof.yml'
  push:
    branches: [main]
    paths:
      - 'rust/sergeant-assurance-kernel/**'
      - 'rust/sergeant-assurance-identity/**'
      - 'main_review/rust_assurance_kernel.py'
      - 'tests/test_sae_r2_kernel.py'
      - 'docs/118-sae-r2-rust-assurance-kernel-candidate.md'
      - 'docs/119-sae-r2-rust-assurance-kernel-candidate-manifest.json'
      - '.github/workflows/sae-r2-rust-proof.yml'

permissions:
  contents: read

jobs:
  assurance-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Re-prove frozen SAE-R1 identity dependency
        run: cargo test --manifest-path rust/sergeant-assurance-identity/Cargo.toml --locked
      - name: Prove independent SAE-R2 assurance kernel
        run: cargo test --manifest-path rust/sergeant-assurance-kernel/Cargo.toml --locked
      - name: Install focused Python proof runner
        run: python -m pip install pytest
      - name: Prove SAE-R2 adversarial reference contract
        run: python -m pytest -q tests/test_sae_r2_kernel.py

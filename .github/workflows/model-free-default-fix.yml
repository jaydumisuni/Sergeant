name: Model-Free Default Correction

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/model-free-default-and-docs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-free-default-and-docs
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact corrections
        run: python scripts/apply_model_free_default_fix.py

      - name: Validate focused product truth
        run: |
          python -m json.tool package.json >/dev/null
          node --check src/vscode/extension.js
          node --check resources/sergeant-command-center-v2.js
          python -m compileall -q main_review tests
          python -m pytest -q \
            tests/test_llm_provider.py \
            tests/test_vscode_extension_package.py \
            tests/test_model_free_default_doctrine.py

      - name: Remove one-use correction machinery
        run: |
          rm scripts/apply_model_free_default_fix.py
          rm .github/workflows/model-free-default-fix.yml

      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make Sergeant model-free by default"
          git push origin HEAD:fix/model-free-default-and-docs

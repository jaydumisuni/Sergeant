name: One-shot model boundary correction

on:
  push:
    branches:
      - docs/model-free-core-optional-reasoning

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/model-free-core-optional-reasoning
          fetch-depth: 0
      - name: Apply bounded correction
        run: python scripts/one_shot_correct_model_boundary.py
      - name: Run focused tests
        run: |
          python -m py_compile tests/test_model_free_product_identity.py
          python -m pytest -q tests/test_model_free_product_identity.py tests/test_agent_working_memory.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Correct Sergeant model-free product identity"
          git push origin HEAD:docs/model-free-core-optional-reasoning

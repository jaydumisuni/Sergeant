name: Apply PR 152 Provider Boundary Repair

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/model-free-default-and-docs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-free-default-and-docs
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply provider boundary repair
        run: python scripts/fix_pr152_provider_boundary.py

      - name: Validate syntax before committing
        run: python -m compileall -q main_review tests

      - name: Remove one-use repair machinery
        run: |
          rm scripts/fix_pr152_provider_boundary.py
          rm .github/workflows/fix-pr152-provider-boundary.yml

      - name: Commit repaired provider boundary
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve explicit optional provider configuration"
          git push origin HEAD:fix/model-free-default-and-docs

name: Apply Command Center Quick-Action Clearance

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_command_center_quick_action_clearance.py
      - .github/workflows/apply-command-center-quick-action-clearance.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-free-default-and-docs
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact clearance correction
        run: python scripts/apply_command_center_quick_action_clearance.py

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/sergeant-command-center-v2.css tests/command-center-visual.spec.js
          git commit -m "Keep quick actions clear of review evidence"
          git push origin HEAD:fix/model-free-default-and-docs

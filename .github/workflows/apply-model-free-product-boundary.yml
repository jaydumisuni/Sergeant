name: Apply Model-Free Product Boundary

on:
  push:
    branches:
      - fix/model-free-default-and-docs
    paths:
      - scripts/apply_model_free_product_boundary.py
      - .github/workflows/apply-model-free-product-boundary.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_model_free_product_boundary.py
      - .github/workflows/apply-model-free-product-boundary.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/model-free-default-and-docs
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact model-free product corrections
        run: python scripts/apply_model_free_product_boundary.py

      - name: Commit corrected product truth
        run: |
          if git diff --quiet; then
            echo "No correction changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md package.json \
            docs/00-product-brief.md \
            docs/22-semantic-open-model-review.md \
            docs/25-cloudflare-workers-ai.md \
            docs/34-cpl-officer-amplification.md \
            docs/35-cpl-council-command-and-experience.md \
            docs/54-model-free-core-and-optional-reasoning.md \
            main_review/llm_provider.py \
            src/vscode/extension.js \
            resources/sergeant-command-center-v2.html \
            resources/sergeant-command-center-v2.js \
            adapters/jetbrains/src/main/kotlin/com/thetechguyds/sergeant/SergeantRunner.kt \
            adapters/jetbrains/src/main/kotlin/com/thetechguyds/sergeant/SergeantToolWindowFactory.kt \
            tests/test_llm_provider.py \
            tests/test_vscode_extension_package.py \
            tests/test_model_free_product_contract.py
          git commit -m "Make Sergeant model-free by default"
          git push origin HEAD:fix/model-free-default-and-docs

      - name: Verify focused product contract
        run: |
          python -m pip install -e .
          python -m pytest -q \
            tests/test_llm_provider.py \
            tests/test_vscode_extension_package.py \
            tests/test_model_free_product_contract.py
          git diff --check

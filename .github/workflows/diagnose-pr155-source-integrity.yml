name: Diagnose PR 155 Source Integrity

on:
  push:
    branches:
      - cleanup/harvest-model-free-tail
    paths:
      - .github/workflows/diagnose-pr155-source-integrity.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Prove checkout contains corrected metadata
        run: |
          grep -F "model-free evidence-based engineering reviewer" adapters/jetbrains/src/main/resources/META-INF/plugin.xml
          grep -F "optional owner-enabled extra reasoning" adapters/jetbrains/src/main/resources/META-INF/plugin.xml
          git diff --exit-code
      - name: Install one-run source mutation guard
        run: |
          cat > /tmp/pr155_source_guard.py <<'PY'
          from __future__ import annotations

          import difflib
          from pathlib import Path

          import pytest

          TARGET = Path.cwd() / "adapters" / "jetbrains" / "src" / "main" / "resources" / "META-INF" / "plugin.xml"
          BASELINE = TARGET.read_text(encoding="utf-8")


          def _check(nodeid: str, phase: str) -> None:
              current = TARGET.read_text(encoding="utf-8")
              if current == BASELINE:
                  return
              diff = "".join(
                  difflib.unified_diff(
                      BASELINE.splitlines(keepends=True),
                      current.splitlines(keepends=True),
                      fromfile="checkout/plugin.xml",
                      tofile=f"after-{nodeid}/plugin.xml",
                  )
              )
              pytest.fail(f"{phase}: {nodeid} mutated tracked source\n{diff}", pytrace=False)


          def pytest_runtest_setup(item):
              _check(item.nodeid, "before test")


          def pytest_runtest_teardown(item, nextitem):
              _check(item.nodeid, "after test")
          PY
      - name: Identify the first source-mutating test
        env:
          PYTHONPATH: /tmp
        run: python -m pytest -x -q -p pr155_source_guard

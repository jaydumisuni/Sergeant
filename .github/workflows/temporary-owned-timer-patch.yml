name: Temporary Owned Timer Patch

on:
  push:
    branches:
      - correct/model-free-product-boundary

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[owned-timer-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: correct/model-free-product-boundary
          fetch-depth: 0

      - name: Apply exact timer ownership patch and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path

          source = Path("resources/sergeant-command-center-v2.js")
          text = source.read_text(encoding="utf-8")
          replacements = {
              "const clockTimer = window.setInterval(updateClock, 1000);":
                  "const clockTimer = setInterval(updateClock, 1000);",
              "window.clearInterval(clockTimer);":
                  "clearInterval(clockTimer);",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected source text missing: {old}")
              text = text.replace(old, new, 1)
          source.write_text(text, encoding="utf-8")
          Path(".github/workflows/temporary-owned-timer-patch.yml").unlink()

      - name: Commit exact patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/sergeant-command-center-v2.js .github/workflows/temporary-owned-timer-patch.yml
          git commit -m "Use owned timer APIs and remove temporary patch workflow [owned-timer-patched]"
          git push origin HEAD:correct/model-free-product-boundary

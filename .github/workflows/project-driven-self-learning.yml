name: Project-Driven Self-Learning

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    paths:
      - ".github/workflows/project-driven-self-learning.yml"
      - ".github/self-learning/project-driven/**"
      - ".github/self-learning/signals/**"
      - "main_review/adaptive_curriculum.py"
      - "main_review/cross_repo_learning.py"
      - "main_review/hermes_learning.py"
      - "main_review/self_learning_queue.py"
      - "scripts/collect_github_learning_candidates.py"
      - "scripts/run_controlled_self_learning.py"
      - "scripts/export_learning_proposals.py"
      - "tests/test_project_driven_learning_workflow.py"

permissions: {}

concurrency:
  group: project-driven-self-learning-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AUTHORITY_HEAD: ${{ github.event.pull_request.head.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
  SERGEANT_LLM_ENABLED: "false"
  SERGEANT_CPL_ENABLED: "false"
  SERGEANT_CPL_POLICY: "disabled"

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'jaydumisuni'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.authorize.outputs.ready }}
      round_id: ${{ steps.packet.outputs.round_id }}
      candidate_count: ${{ steps.packet.outputs.candidate_count }}
    steps:
      - name: Checkout exact learning head without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sergeant and focused test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Prove project-driven learning contracts without provider secrets
        run: |
          python -m pytest -q \
            tests/test_project_driven_learning_workflow.py \
            tests/test_cross_repo_learning.py \
            tests/test_hermes_learning.py \
            tests/test_self_learning_queue.py \
            tests/test_techguycheckm8_cross_repo_harvest.py \
            tests/test_run_static_training_set_provenance.py

      - name: Verify explicit owner and round authorization gates
        id: authorize
        shell: bash
        run: |
          set -euo pipefail
          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          subject="$(git log -1 --pretty=%s)"
          if jq -e 'index("self-learning-authorized") != null' <<<"${labels}" >/dev/null \
             && [[ "${subject}" == START_PROJECT_LEARNING* ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Project learning skipped: explicit owner label and START_PROJECT_LEARNING commit are both required."
          fi

      - name: Build exact manifest-bound candidate packet
        id: packet
        if: steps.authorize.outputs.ready == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mapfile -t manifests < <(git diff --name-only "${BASE_SHA}" "${AUTHORITY_HEAD}" -- '.github/self-learning/project-driven/*.json')
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "Exactly one changed project-driven learning manifest is required; found ${#manifests[@]}." >&2
            printf '%s\n' "${manifests[@]}" >&2
            exit 1
          fi
          manifest="${manifests[0]}"
          round_id="$(jq -er '.round_id | select(type == "string" and length > 0)' "${manifest}")"
          expected_count="$(jq -er '.candidate_count | select(type == "number" and . > 0 and . <= 3)' "${manifest}")"
          test "$(jq -r '.authority.required_label' "${manifest}")" = "self-learning-authorized"
          test "$(jq -r '.authority.required_commit_prefix' "${manifest}")" = "START_PROJECT_LEARNING"
          test "$(jq -r '.authority.may_auto_promote' "${manifest}")" = "false"
          test "$(jq -r '.authority.may_auto_merge' "${manifest}")" = "false"
          test "$(jq -r '.authority.final_verdict' "${manifest}")" = "Sergeant"
          mkdir -p "build/${round_id}"
          python - "${manifest}" "build/${round_id}/candidates.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from scripts.collect_github_learning_candidates import _signal_candidates

          manifest_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_ids = list(manifest["expected_case_ids"])
          signal_paths = [Path(value) for value in manifest["signal_paths"]]
          if len(expected_ids) != int(manifest["candidate_count"]) or len(signal_paths) != len(expected_ids):
              raise SystemExit("manifest candidate count does not match expected IDs and signal paths")
          actual_ids = []
          for path in signal_paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              actual_ids.append(str(payload.get("case_id") or ""))
          if actual_ids != expected_ids:
              raise SystemExit(f"manifest signal/case binding mismatch: {actual_ids!r} != {expected_ids!r}")
          candidates = _signal_candidates(Path(".github/self-learning/signals"))
          by_id = {str(row["case_id"]): row for row in candidates}
          selected = []
          for case_id in expected_ids:
              row = by_id.get(case_id)
              if row is None:
                  raise SystemExit(f"manifest case is not currently candidate-ready and unprocessed: {case_id}")
              selected.append(row)
          authority_head = os.environ["AUTHORITY_HEAD"].lower()
          packet = {
              "schema_version": "sergeant.github-learning-candidates.v1",
              "week_id": manifest["round_id"],
              "reviewer_frozen_before_collection": authority_head,
              "truth_persisted_before_blind_review": False,
              "project_driven": True,
              "manifest": manifest_path.as_posix(),
              "candidate_count": len(selected),
              "direct_signal_candidate_count": len(selected),
              "candidates": selected,
          }
          output_path.write_text(json.dumps(packet, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          actual_count="$(jq -er '.candidate_count' "build/${round_id}/candidates.json")"
          test "${actual_count}" = "${expected_count}"
          echo "round_id=${round_id}" >> "$GITHUB_OUTPUT"
          echo "candidate_count=${actual_count}" >> "$GITHUB_OUTPUT"
          cat "build/${round_id}/candidates.json"

      - name: Upload frozen project-learning validation packet
        if: steps.authorize.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: project-learning-validation-${{ steps.packet.outputs.round_id }}
          path: build/${{ steps.packet.outputs.round_id }}/
          if-no-files-found: error
          retention-days: 30

  learn:
    needs: validate
    if: >-
      needs.validate.result == 'success' &&
      needs.validate.outputs.ready == 'true' &&
      needs.validate.outputs.candidate_count != '0'
    environment: sergeant-self-learning-week-1
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      models: read
    env:
      ROUND_ID: ${{ needs.validate.outputs.round_id }}
      CANDIDATE_COUNT: ${{ needs.validate.outputs.candidate_count }}
      SERGEANT_LEARNING_BACKEND: github_models
      SERGEANT_TEACHER_MODEL: openai/gpt-4.1
      SERGEANT_PROSECUTOR_MODEL: openai/gpt-4.1
      SERGEANT_DEFENDER_MODEL: openai/gpt-4.1
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact validated learning head without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen Sergeant package
        run: python -m pip install -e .

      - name: Download frozen manifest-bound candidate packet
        uses: actions/download-artifact@v4
        with:
          name: project-learning-validation-${{ env.ROUND_ID }}
          path: build/${{ env.ROUND_ID }}

      - name: Run frozen blind reviews and isolated council
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_controlled_self_learning.py \
            --candidates "build/${ROUND_ID}/candidates.json" \
            --output-dir "build/${ROUND_ID}/round" \
            --authority-head "${AUTHORITY_HEAD}" \
            --target-branch "${TARGET_BRANCH}" \
            --count "${CANDIDATE_COUNT}" \
            2>&1 | tee "build/${ROUND_ID}/round.log"

      - name: Export bounded proposals without raw fixing patches
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_learning_proposals.py \
            --queue "build/${ROUND_ID}/round/learning-queue.json" \
            --output learning/proposals \
            2>&1 | tee "build/${ROUND_ID}/proposal-export.log"
          if grep -R -n -E '(github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk-[A-Za-z0-9]{20,})' "learning/proposals/${ROUND_ID}"; then
            echo "credential-like material found in proposal export" >&2
            exit 1
          fi

      - name: Publish bounded proposal evidence to the workflow log
        shell: bash
        run: |
          set -euo pipefail
          echo "SERGEANT_PROJECT_LEARNING_PROPOSALS_BEGIN"
          cat "learning/proposals/${ROUND_ID}/index.json"
          for proposal in "learning/proposals/${ROUND_ID}"/learn-*.json; do
            test -s "${proposal}"
            echo "--- ${proposal} ---"
            cat "${proposal}"
          done
          echo "SERGEANT_PROJECT_LEARNING_PROPOSALS_END"

      - name: Upload immutable project-learning evidence and bounded proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-driven-self-learning-${{ env.ROUND_ID }}
          path: |
            build/${{ env.ROUND_ID }}/
            learning/proposals/${{ env.ROUND_ID }}/
          if-no-files-found: error
          retention-days: 90

  handoff:
    name: Validate owner-controlled proposal handoff
    needs:
      - validate
      - learn
    if: >-
      needs.validate.outputs.ready == 'true' &&
      needs.learn.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ROUND_ID: ${{ needs.validate.outputs.round_id }}
    steps:
      - name: Download bounded project-learning artifact
        uses: actions/download-artifact@v4
        with:
          name: project-driven-self-learning-${{ env.ROUND_ID }}
          path: downloaded

      - name: Enforce no automatic promotion or merge
        shell: bash
        run: |
          set -euo pipefail
          index="downloaded/learning/proposals/${ROUND_ID}/index.json"
          test -s "${index}"
          test "$(jq -r '.automatic_promotions' "${index}")" = "0"
          test "$(jq -r '.automatic_merges' "${index}")" = "0"
          test "$(jq -r '.authority_head' "${index}")" = "${AUTHORITY_HEAD}"
          echo "Bounded project-learning council evidence is ready for the next governed controls/transfer stage."

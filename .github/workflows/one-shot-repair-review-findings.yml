name: One-shot repair verified Main Review findings

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/one_shot_repair_review_findings.py
      - .github/workflows/one-shot-repair-review-findings.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'docs/model-free-core-optional-reasoning'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/model-free-core-optional-reasoning
          fetch-depth: 0
      - name: Apply verified repairs
        run: python scripts/one_shot_repair_review_findings.py
      - name: Run focused proof before commit
        continue-on-error: true
        run: |
          python -m py_compile main_review/llm_provider.py tests/test_llm_provider.py tests/test_model_free_product_identity.py
          node --check resources/sergeant-command-center-v2.js
          python -m pytest -q tests/test_llm_provider.py tests/test_cloudflare_provider.py tests/test_model_free_product_identity.py tests/test_static_credential_destination_review.py
      - name: Commit repairs for exact-head proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair credential origin and timer lifecycle findings"
          git push origin HEAD:docs/model-free-core-optional-reasoning

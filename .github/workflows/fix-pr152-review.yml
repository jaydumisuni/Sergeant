name: Apply PR 152 Review Repairs

on:
  push:
    branches:
      - fix/model-free-default-and-docs
    paths:
      - scripts/fix_pr152_review.py
      - .github/workflows/fix-pr152-review.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply verified review repairs
        run: python scripts/fix_pr152_review.py

      - name: Validate focused behavior
        run: |
          python -m compileall -q main_review tests
          python -m pytest -q tests/test_llm_provider.py tests/test_llm_cli.py tests/test_model_free_product_contract.py

      - name: Remove one-use repair machinery
        run: |
          rm scripts/fix_pr152_review.py
          rm .github/workflows/fix-pr152-review.yml

      - name: Commit reviewed head
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Resolve PR 152 model-free default review findings"
          git push origin HEAD:fix/model-free-default-and-docs
